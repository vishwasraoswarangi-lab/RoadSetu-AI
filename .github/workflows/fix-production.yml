name: RoadSetu production repair

on:
  push:
    branches: [production-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[server-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair server safely
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('server.ts')
          s = p.read_text(encoding='utf-8')

          # Add Firebase Admin imports once.
          imports = (
              "import { getApps, initializeApp, cert, applicationDefault } from 'firebase-admin/app';\n"
              "import { getAuth as getAdminAuth } from 'firebase-admin/auth';\n"
              "import { getFirestore as getAdminFirestore } from 'firebase-admin/firestore';\n"
          )
          if "firebase-admin/auth" not in s:
              s = s.replace("import dotenv from 'dotenv';\n", "import dotenv from 'dotenv';\n" + imports, 1)

          # Remove the old insecure client-controlled authority middleware.
          s = re.sub(
              r"\n/\*\*\n \* Backend authorization middleware\..*?\nfunction requireAuthority\(.*?\n\}\n",
              "\n",
              s,
              flags=re.S,
          )

          # Remove the obsolete demo profile endpoint and all demo identities.
          s = re.sub(
              r"\n/\*\*\n \* Auth contract endpoint:.*?\napp\.post\('/api/auth/profile'.*?\n\}\);\n",
              "\n",
              s,
              flags=re.S,
          )

          # Insert verified Firebase-token middleware exactly once.
          marker = "app.use(express.json({ limit: '15mb' }));"
          if "PRODUCTION_FIREBASE_AUTH_MIDDLEWARE" not in s:
              block = r'''

// PRODUCTION_FIREBASE_AUTH_MIDDLEWARE
let firebaseAdminReady = false;
try {
  if (!getApps().length) {
    const projectId = process.env.FIREBASE_PROJECT_ID;
    const clientEmail = process.env.FIREBASE_CLIENT_EMAIL;
    const privateKey = process.env.FIREBASE_PRIVATE_KEY?.replace(/\\n/g, '\n');
    if (projectId && clientEmail && privateKey) {
      initializeApp({ credential: cert({ projectId, clientEmail, privateKey }) });
    } else {
      initializeApp({ credential: applicationDefault() });
    }
  }
  firebaseAdminReady = true;
} catch (error) {
  console.error('Firebase Admin initialization failed:', error);
}

async function requireFirebaseUser(req: Request, res: Response, next: NextFunction) {
  if (!firebaseAdminReady) {
    return res.status(503).json({ success: false, error: 'Server authentication is not configured.' });
  }
  const header = req.headers.authorization || '';
  if (!header.startsWith('Bearer ')) {
    return res.status(401).json({ success: false, error: 'Authentication required.' });
  }
  try {
    const decoded = await getAdminAuth().verifyIdToken(header.slice(7), true);
    (req as Request & { firebaseUser?: typeof decoded }).firebaseUser = decoded;
    return next();
  } catch (error) {
    console.error('Firebase token verification failed:', error);
    return res.status(401).json({ success: false, error: 'Invalid or expired Firebase session.' });
  }
}

async function requireAuthority(req: Request, res: Response, next: NextFunction) {
  const uid = (req as Request & { firebaseUser?: { uid?: string } }).firebaseUser?.uid;
  if (!uid) return res.status(401).json({ success: false, error: 'Authentication required.' });
  try {
    const snap = await getAdminFirestore().collection('users').doc(uid).get();
    const role = String(snap.data()?.role || 'citizen').toLowerCase();
    if (!['authority', 'municipal_officer', 'admin'].includes(role)) {
      return res.status(403).json({ success: false, error: 'Authority access required.' });
    }
    return next();
  } catch (error) {
    console.error('Authority permission lookup failed:', error);
    return res.status(403).json({ success: false, error: 'Unable to verify authority permissions.' });
  }
}

app.use(['/api/analyze-defect', '/api/verify-repair'], requireFirebaseUser);
app.use('/api/authority', requireFirebaseUser, requireAuthority);
'''
              s = s.replace(marker, marker + block, 1)

          s = s.replace('const PORT = 3000;', 'const PORT = Number(process.env.PORT || 3000);')
          s = s.replace('startServer();\n', "if (!process.env.NETLIFY) startServer();\n\nexport { app };\n", 1)
          p.write_text(s, encoding='utf-8')

          nf = Path('netlify/functions/api.ts')
          nf.parent.mkdir(parents=True, exist_ok=True)
          nf.write_text("import serverless from 'serverless-http';\nimport { app } from '../../server';\nexport const handler = serverless(app);\n", encoding='utf-8')

          Path('netlify.toml').write_text('''[build]\n  command = "npm run build"\n  publish = "dist"\n\n[functions]\n  directory = "netlify/functions"\n  node_bundler = "esbuild"\n  external_node_modules = ["express", "firebase-admin", "serverless-http"]\n\n[[redirects]]\n  from = "/api/*"\n  to = "/.netlify/functions/api/:splat"\n  status = 200\n  force = true\n\n[[redirects]]\n  from = "/*"\n  to = "/index.html"\n  status = 200\n''', encoding='utf-8')

      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts netlify/functions/api.ts netlify.toml
          if git diff --cached --quiet; then
            echo 'No repair changes required.'
          else
            git commit -m 'fix: repair production auth and deployment [server-repaired]'
            git push origin production-hardening
          fi
